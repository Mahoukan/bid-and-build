<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18594b">
<title>Connection required · Bid and Build</title>
<style>
  :root { color-scheme: light dark; font: 1rem/1.6 system-ui, sans-serif; color: #20372e; background: #f6f7f2; }
  body { margin: 0; padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); }
  main { max-width: 30rem; margin: 10vh auto; } h1 { line-height: 1.2; }
  button, a { font: inherit; color: inherit; } button { padding: .75rem 1rem; background: #18594b; color: white; border: 0; border-radius: .5rem; cursor: pointer; }
  button:disabled { opacity: .6; } :focus-visible { outline: 3px solid #cd8d21; outline-offset: 4px; }
  @media (prefers-color-scheme: dark) { :root { color: #eaf3ed; background: #14251e; } }
</style>
<main>
  <svg width="56" height="56" viewBox="0 0 40 40" aria-label="Bid and Build" role="img"><rect width="40" height="40" rx="12" fill="#18594b"/><path d="M10 11h9v9h-9zm11 9h9v9h-9zm-11 2h9v7h-9z" fill="#fff"/></svg>
  <h1>A connection is required</h1>
  <p>Bid and Build is an online multiplayer game. Reconnect to the server to join or continue. Bids and changes are never queued offline.</p>
  <p>Your saved drafts and seat stay in this browser. After reconnecting, a paused game still needs the host to Resume.</p>
  <button id="retry">Retry connection</button> <a href="/">Home</a>
  <p id="status" role="status"></p>
</main>
<script>
  document.getElementById('retry').addEventListener('click', async () => {
    const button = document.getElementById('retry');
    const status = document.getElementById('status');
    button.disabled = true; status.textContent = 'Checking the server…';
    try {
      const response = await fetch('/health', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
      if (!response.ok || (await response.json()).status !== 'ready') throw new Error();
      location.reload();
    } catch { status.textContent = 'The server is still unavailable. Please try again shortly.'; button.disabled = false; }
  });
</script>
</html>
